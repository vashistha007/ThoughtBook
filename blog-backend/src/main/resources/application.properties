spring.application.name=blog
#spring.data.mongodb.uri=mongodb://localhost:27017/thoughtbook
#spring.data.mongodb.auto-index-creation=true

# Database Configuration (Cloud via Env Vars + Local Fallback)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port (Render automatically injects PORT)
server.port=${PORT:8080}

#                         ---------------------
#                           Security properties
#                         ---------------------

# JWT Configuration
# Minimum 256-bit (32 characters ya usse lambi strong string honi chahiye)
app.jwt-secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiry time milliseconds mein (e.g., 24 ghante = 86400000 ms)
app.jwt-expiration-milliseconds=86400000